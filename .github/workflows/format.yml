on:
  push:
    branches: [ dev, main ]
  pull_request:

# Auto cancel previous runs if they were not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Rust format

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - run: rustup component add rustfmt

      - name: Install protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check code format
        run: |
          cargo fmt --all -- --check

      # Catches `#[cfg(...)]` arms that substitute a bare true/false for a
      # security-relevant binding -- a fail-open that produces no compile error
      # and no runtime log on builds where the cfg is off. See the script header
      # for the flodbadd/whitelists.rs case this was written for. The script is
      # kept identical to edamame_core/tools/cfg_fallback_check.py; this copy
      # scans only this repo.
      - name: Check cfg security fallbacks
        run: |
          python3 tools/cfg_fallback_check.py

      - name: Install cargo-hack
        run: |
          cargo install -f cargo-hack

      - name: Check all features
        run: |
          cargo hack check --all-features --all-targets